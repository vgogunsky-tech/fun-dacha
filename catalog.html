<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Каталог продукції | FUN DACHA</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fdfdfd;
      --fg: #1f2a37;
      --muted: #6b7280;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.12);
      --card: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      font-size: clamp(15px, 1.2vw, 16px);
    }

    .product-table td.description-cell {
      max-width: 360px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 50%, #fff 100%);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    header {
      padding: 1.75rem clamp(1rem, 4vw, 3rem) 1rem;
      background: radial-gradient(circle at top left, #d1fae5, transparent 55%),
        radial-gradient(circle at top right, #fee2e2, transparent 45%), var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(6px);
      width: 100%;
    }

    header h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
    }

    main {
      width: min(1200px, calc(100% - clamp(2rem, 6vw, 5rem)));
      margin: 0 auto 3rem;
      padding: 1.5rem 0 3rem;
      display: grid;
      gap: 1.5rem;
      flex: 1 0 auto;
    }

    section {
      background: var(--card);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .toolbar {
      display: grid;
      gap: 1rem;
    }

    .toolbar-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      align-items: end;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
    }

    select {
      width: 100%;
      min-height: 8rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      padding: 0.75rem;
      font-size: 0.95rem;
      background: #fff;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 0.65rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button.primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
    }

    button.secondary {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .quick-nav-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .quick-nav {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
    }

    .quick-nav button {
      background: #fff;
      color: var(--fg);
      border: 1px solid var(--border);
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .category-section {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .category-header h2 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
    }

    .category-header p {
      margin: 0;
      color: var(--muted);
    }

    .subcategory {
      margin-top: 0.5rem;
    }

    .subcategory h3 {
      margin: 0 0 0.35rem;
      font-size: 1.25rem;
    }

    .subcategory p {
      margin: 0 0 0.75rem;
      color: var(--muted);
    }

    .table-wrapper {
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow-x: auto;
      background: #fff;
      box-shadow: inset 0 1px 1px rgba(15, 23, 42, 0.05);
    }

    .product-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
      font-size: 0.92rem;
    }

    .product-table th,
    .product-table td {
      padding: 0.7rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .product-table th {
      background: #ecfeff;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #0f172a;
    }

    .product-table tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    .product-table tbody tr:hover {
      background: #eef2ff;
    }

    .table-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.12rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .empty-message {
      color: var(--muted);
      font-style: italic;
    }

    #status {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    #status.error {
      color: #dc2626;
      font-weight: 600;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
    }

    .loading.active {
      display: inline-flex;
    }

    .spinner {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 720px) {
      header {
        position: static;
      }

      select {
        min-height: 6rem;
      }

      .toolbar-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Каталог продукції FUN DACHA</h1>
  </header>

  <main>
    <section class="toolbar">
      <div class="toolbar-grid">
        <div>
          <label for="column-select">Колонки для експорту (Ctrl/Cmd + клік)</label>
          <select id="column-select" multiple></select>
          <small class="helper-text">Стандартно обрані найпопулярніші поля, але ви можете експортувати будь-яку комбінацію.</small>
        </div>
        <div>
          <label>Дії з вибраними колонками</label>
          <div class="toolbar-actions">
            <button id="preset-columns" type="button" class="secondary">Популярні</button>
            <button id="select-all" type="button" class="secondary">Усі</button>
            <button id="clear-selection" type="button" class="secondary">Очистити</button>
            <button id="export-btn" type="button" class="primary">Експортувати CSV</button>
          </div>
          <div id="status"></div>
          <div class="loading" id="loading-indicator">
            <span class="spinner" aria-hidden="true"></span>
            <span>Завантаження даних…</span>
          </div>
        </div>
      </div>
    </section>

    <section class="quick-nav-wrapper">
      <div class="section-title">
        <h2>Швидкі посилання на категорії</h2>
        <p class="helper-text">
          Натисніть кнопку, щоб плавно перейти до відповідного розділу нижче.
        </p>
      </div>
      <div id="category-nav" class="quick-nav" aria-label="Швидкі посилання"></div>
    </section>

    <div id="catalog"></div>
  </main>

  <script>
    const state = {
      categories: [],
      categoryTree: [],
      categoryMap: new Map(),
      products: [],
      productHeaders: [],
      groupedProducts: new Map(),
    };

    const popularColumns = ["id", "name_uk", "availability", "year", "weight", "price"];

    const COLUMN_LABELS = {
      id: "ID",
      name_uk: "Назва",
      name_ru: "Назва (рос)",
      description_uk: "Опис",
      description_ru: "Опис (рос)",
      primary_image: "Основне зображення",
      category_id: "Категорія",
      subcategory_id: "Підкатегорія",
      product_id: "Код продукту",
      year: "Рік",
      availability: "Наявність",
      images: "Зображення",
      tags: "Теги",
      price: "Ціна",
      weight: "Вага",
      length: "Довжина",
      width: "Ширина",
      height: "Висота",
      model: "Модель",
      seo: "SEO",
      created_at: "Створено",
      updated_at: "Оновлено",
      status: "Статус",
      sku: "Артикул",
      quantity: "Кількість",
      minimum: "Мінімальна кількість",
      subtract: "Списання",
      stock_status_id: "Статус складу",
      shipping: "Доставка",
      points: "Бали",
      weight_class: "Клас ваги",
      length_class_id: "Клас довжини",
      sort_order: "Порядок сортування",
      date_available: "Дата доступності",
    };

    const getColumnLabel = (key) => COLUMN_LABELS[key] || key;

    const TABLE_COLUMNS = ["id", "name_uk", "description_uk", "availability", "year", "weight", "price"].map(
      (key) => ({ key, label: getColumnLabel(key) })
    );

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      toggleLoading(true);
      try {
        const [categoryText, productText] = await Promise.all([
          fetch("data/categories_list.csv").then((r) => {
            if (!r.ok) throw new Error("Unable to load categories_list.csv");
            return r.text();
          }),
          fetch("data/list.csv").then((r) => {
            if (!r.ok) throw new Error("Unable to load list.csv");
            return r.text();
          }),
        ]);

        const categoryParsed = parseCSV(categoryText);
        const productParsed = parseCSV(productText);

        state.categories = toObjects(categoryParsed).filter((row) => row.id);
        const tree = buildCategoryTree(state.categories);
        state.categoryTree = tree.roots;
        state.categoryMap = tree.map;

        state.products = toObjects(productParsed).filter((row) => row.id);
        state.productHeaders = productParsed.headers;
        state.groupedProducts = groupProducts(state.products);

        populateColumnSelect();
        renderQuickNav();
        renderCatalog();
        showStatus(
          `Завантажено ${state.categories.length} категорій та ${state.products.length} товарів.`
        );
      } catch (error) {
        console.error(error);
        showStatus(error.message || "Сталася помилка під час завантаження.", true);
      } finally {
        toggleLoading(false);
      }
    }

    function parseCSV(text) {
      const rows = [];
      let current = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (insideQuotes) {
          if (char === "\"") {
            if (next === "\"") {
              value += "\"";
              i += 1;
            } else {
              insideQuotes = false;
            }
          } else {
            value += char;
          }
        } else {
          if (char === "\"") {
            insideQuotes = true;
          } else if (char === ",") {
            current.push(value);
            value = "";
          } else if (char === "\r") {
            // skip
          } else if (char === "\n") {
            current.push(value);
            rows.push(current);
            current = [];
            value = "";
          } else {
            value += char;
          }
        }
      }

      if (value.length || current.length) {
        current.push(value);
        rows.push(current);
      }

      const headers = rows[0] || [];
      return { headers, rows: rows.slice(1) };
    }

    function toObjects(parsed) {
      return parsed.rows.map((row) => {
        const obj = {};
        parsed.headers.forEach((header, idx) => {
          obj[header] = row[idx] !== undefined ? row[idx] : "";
        });
        return obj;
      });
    }

    function buildCategoryTree(categories) {
      const map = new Map();
      categories.forEach((cat) => {
        const parentId = (cat.parentId || cat.parent_id || "").trim();
        const clone = {
          ...cat,
          name: cat.name || cat.name_uk || "",
          description: cat.description || cat.description_uk || "",
          parentId,
          parent_id: parentId,
          children: [],
        };
        map.set((cat.id || "").trim(), clone);
      });

      const roots = [];
      map.forEach((cat) => {
        const parentId = (cat.parentId || cat.parent_id || "").trim();
        if (parentId && map.has(parentId)) {
          map.get(parentId).children.push(cat);
        } else {
          roots.push(cat);
        }
      });

      return { roots, map };
    }

    function groupProducts(products) {
      const byCategory = new Map();
      products.forEach((product) => {
        const categoryId = (product["category_id"] || "").trim();
        if (!categoryId) return;
        const subcategoryId = (product["subcategory_id"] || "").trim();

        if (!byCategory.has(categoryId)) {
          byCategory.set(categoryId, {
            noSubcategory: [],
            subcategories: new Map(),
          });
        }

        const entry = byCategory.get(categoryId);
        if (subcategoryId) {
          if (!entry.subcategories.has(subcategoryId)) {
            entry.subcategories.set(subcategoryId, []);
          }
          entry.subcategories.get(subcategoryId).push(product);
        } else {
          entry.noSubcategory.push(product);
        }
      });

      return byCategory;
    }

    function populateColumnSelect() {
      const select = document.getElementById("column-select");
      select.innerHTML = "";
      state.productHeaders.forEach((header) => {
        const option = document.createElement("option");
        option.value = header;
        option.textContent = getColumnLabel(header);
        option.selected = popularColumns.includes(header);
        select.appendChild(option);
      });

      document.getElementById("preset-columns").addEventListener("click", () => {
        [...select.options].forEach((opt) => {
          opt.selected = popularColumns.includes(opt.value);
        });
      });

      document.getElementById("select-all").addEventListener("click", () => {
        [...select.options].forEach((opt) => {
          opt.selected = true;
        });
      });

      document.getElementById("clear-selection").addEventListener("click", () => {
        [...select.options].forEach((opt) => {
          opt.selected = false;
        });
      });

      document.getElementById("export-btn").addEventListener("click", () => {
        const selected = [...select.selectedOptions].map((opt) => opt.value);
        if (!selected.length) {
          showStatus("Оберіть хоча б одну колонку перед експортом.", true);
          return;
        }
        exportCSV(selected);
      });
    }

    function renderQuickNav() {
      const nav = document.getElementById("category-nav");
      nav.innerHTML = "";

      if (!state.categoryTree.length) {
        nav.textContent = "Категорії не знайдені";
        return;
      }

      state.categoryTree.forEach((cat) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cat.name || `Категорія ${cat.id}`;
        btn.addEventListener("click", () => {
          const section = document.getElementById(`category-${cat.id}`);
          section?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        nav.appendChild(btn);
      });
    }

    function renderCatalog() {
      const container = document.getElementById("catalog");
      container.innerHTML = "";

      state.categoryTree.forEach((category) => {
        const section = document.createElement("section");
        section.id = `category-${category.id}`;
        section.className = "category-section";

        const header = document.createElement("div");
        header.className = "category-header";
        header.innerHTML = `
          <h2>${category.name || "Категорія без назви"}</h2>
          ${category.description ? `<p>${category.description}</p>` : ""}
        `;

        const content = document.createElement("div");
        const grouped = state.groupedProducts.get((category.id || "").trim());

        if (grouped) {
          const renderedSubcategories = new Set();

          (category.children || []).forEach((child) => {
            renderedSubcategories.add((child.id || "").trim());
            const block = document.createElement("article");
            block.className = "subcategory";
            block.innerHTML = `
              <h3>${child.name}</h3>
              ${child.description ? `<p>${child.description}</p>` : ""}
            `;
            block.appendChild(
              buildProductTable(grouped.subcategories.get((child.id || "").trim()))
            );
            content.appendChild(block);
          });

          grouped.subcategories.forEach((products, subId) => {
            if (renderedSubcategories.has(subId)) return;
            const fallbackBlock = document.createElement("article");
            fallbackBlock.className = "subcategory";
            const fallbackName = state.categoryMap.get(subId)?.name || `Підкатегорія ${subId}`;
            fallbackBlock.innerHTML = `<h3>${fallbackName}</h3>`;
            fallbackBlock.appendChild(buildProductTable(products));
            content.appendChild(fallbackBlock);
          });

          if (grouped.noSubcategory.length) {
            const directBlock = document.createElement("article");
            directBlock.className = "subcategory";
            directBlock.innerHTML = "<h3>Товари без підкатегорії</h3>";
            directBlock.appendChild(buildProductTable(grouped.noSubcategory));
            content.appendChild(directBlock);
          }
        } else {
          const empty = document.createElement("p");
          empty.className = "empty-message";
          empty.textContent = "Немає товарів у цій категорії.";
          content.appendChild(empty);
        }

        section.appendChild(header);
        section.appendChild(content);
        container.appendChild(section);
      });
    }

    function buildProductTable(products = []) {
      const wrapper = document.createElement("div");
      wrapper.className = "table-wrapper";

      if (!products.length) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "Немає товарів.";
        wrapper.appendChild(empty);
        return wrapper;
      }

      const table = document.createElement("table");
      table.className = "product-table";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      TABLE_COLUMNS.forEach((column) => {
        const th = document.createElement("th");
        th.textContent = column.label;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      products.forEach((product) => {
        const row = document.createElement("tr");
        TABLE_COLUMNS.forEach((column) => {
          const cell = document.createElement("td");
          let rawValue = product[column.key];
          if (rawValue === undefined) {
            if (column.key === "name_uk") {
              rawValue = product.name_ru;
            } else if (column.key === "description_uk") {
              rawValue = product.description_ru;
            }
          }
          if (column.key === "description_uk") {
            cell.classList.add("description-cell");
            cell.title = formatValue(rawValue);
          }
          cell.textContent = formatValue(rawValue);
          row.appendChild(cell);
        });

        tbody.appendChild(row);
      });

      table.appendChild(tbody);
      wrapper.appendChild(table);
      return wrapper;
    }

    function formatValue(value) {
      if (value === null || value === undefined) return "—";
      const cleaned = String(value).replace(/\s+/g, " ").trim();
      return cleaned || "—";
    }

    function exportCSV(selectedColumns) {
      const header = [
        "Категорія",
        "Підкатегорія",
        ...selectedColumns.map((col) => getColumnLabel(col)),
      ];
      const rows = [header];

      state.categoryTree.forEach((category) => {
        const catId = (category.id || "").trim();
        const grouped = state.groupedProducts.get(catId);
        if (!grouped) return;

        const categoryLabel = category.name || catId || "Категорія без назви";

        const processProducts = (products, subLabel = "") => {
          products.forEach((product) => {
            const row = [
              categoryLabel,
              subLabel,
              ...selectedColumns.map((col) => sanitizeValue(product[col])),
            ];
            rows.push(row);
          });
        };

        const handledSubcategories = new Set();

        (category.children || []).forEach((child) => {
          const subId = (child.id || "").trim();
          handledSubcategories.add(subId);
          const products = grouped.subcategories.get(subId) || [];
          if (!products.length) return;
          const subLabel = child.name || subId;
          processProducts(products, subLabel);
        });

        grouped.subcategories.forEach((products, subId) => {
          if (handledSubcategories.has(subId) || !products.length) return;
          const fallbackName = state.categoryMap.get(subId)?.name || subId;
          processProducts(products, fallbackName);
        });

        if (grouped.noSubcategory.length) {
          processProducts(grouped.noSubcategory, "");
        }
      });

      const csvContent = rows.map((row) => row.map(escapeCSV).join(",")).join("\n");
      const blob = new Blob([csvContent], {
        type: "text/csv;charset=utf-8;",
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const timestamp = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `catalog-export-${timestamp}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      showStatus("CSV успішно згенеровано.");
    }

    function escapeCSV(value) {
      const stringValue = value ?? "";
      if (/[",\n]/.test(stringValue)) {
        return `"${stringValue.replace(/"/g, '""')}"`;
      }
      return stringValue;
    }

    function sanitizeValue(value) {
      if (value === null || value === undefined) return "";
      return String(value).replace(/\r?\n/g, " ");
    }

    function toggleLoading(isVisible) {
      const loader = document.getElementById("loading-indicator");
      loader.classList.toggle("active", isVisible);
    }

    function showStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.classList.toggle("error", !!isError);
    }
  </script>
</body>
</html>
